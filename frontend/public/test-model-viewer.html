<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Model Viewer Test</title>
    <style>
        body { margin: 0; font-family: Arial; background: #000; }
        #container { width: 100%; height: 100vh; display: flex; flex-direction: column; }
        model-viewer { flex: 1; width: 100%; }
        #info { padding: 20px; background: #222; color: #fff; font-size: 12px; max-height: 200px; overflow-y: auto; }
        .status { padding: 5px 0; font-weight: bold; }
        .success { color: #0f0; }
        .error { color: #f00; }
        button { padding: 10px 20px; margin: 5px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="container">
        <model-viewer
            id="model"
            src="https://arigroup-api.onrender.com/model/1558a114-42cd-44aa-897a-7521c53d5800"
            alt="Test Model"
            camera-controls
            environment-image="neutral"
            shadow-intensity="1"
            style="width: 100%; height: 100%;"
        ></model-viewer>
        <div id="info">
            <div class="status">🔍 Diagnostics:</div>
            <div id="diagnostics"></div>
            <button onclick="testFetch()">Test Fetch</button>
            <button onclick="clearLog()">Clear</button>
        </div>
    </div>

    <script type="module">
        import 'https://cdn.jsdelivr.net/npm/@google/model-viewer@latest/dist/model-viewer.min.js';

        const model = document.getElementById('model');
        const diag = document.getElementById('diagnostics');

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            div.textContent = '• ' + msg;
            diag.appendChild(div);
            console.log(msg);
        }

        log('Page started on: ' + new Date().toLocaleTimeString(), 'info');

        // Check if model-viewer loaded
        if (model) {
            log('✓ model-viewer element found', 'success');
        }

        // Check src URL is valid
        const src = model.getAttribute('src');
        if (src) {
            log('✓ src attribute: ' + src.substring(0, 50) + '...', 'success');
        }

        // Listen for load event
        model.addEventListener('load', () => {
            log('✓ Model loaded!', 'success');
        });

        // Listen for error event
        model.addEventListener('error', (e) => {
            log('✗ Model error: ' + (e?.detail?.type || 'Unknown'), 'error');
            console.error('Full error:', e);
        });

        // Check canActivateAR
        setTimeout(() => {
            if (model.canActivateAR) {
                log('✓ AR available', 'success');
            } else {
                log('⚠ AR unavailable', 'error');
            }
        }, 2000);

        window.testFetch = async () => {
            log('Testing fetch...', 'info');
            try {
                const response = await fetch('https://arigroup-api.onrender.com/model/1558a114-42cd-44aa-897a-7521c53d5800');
                log(`HTTP ${response.status}`, response.ok ? 'success' : 'error');
                log(`Content-Type: ${response.headers.get('content-type')}`, 'success');
                const blob = await response.blob();
                log(`Size: ${(blob.size / 1024 / 1024).toFixed(2)} MB`, 'success');
            } catch (e) {
                log(`✗ ${e.message}`, 'error');
            }
        };

        window.clearLog = () => {
            diag.innerHTML = '';
        };

        // Auto-test fetch on load
        setTimeout(() => testFetch(), 500);
    </script>
</body>
</html>
