<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>ARIGroup AR Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a}

#cam{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
#cvs{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}

#status{
  position:absolute;bottom:120px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);
  color:#fff;font-family:-apple-system,sans-serif;font-size:14px;font-weight:500;
  padding:10px 20px;border-radius:20px;white-space:nowrap;
  transition:opacity 0.4s;
}
#placebtn{
  position:absolute;bottom:52px;left:50%;transform:translateX(-50%);
  background:rgba(124,58,237,0.9);backdrop-filter:blur(8px);
  color:#fff;font-family:-apple-system,sans-serif;font-size:15px;font-weight:600;
  padding:14px 36px;border-radius:28px;pointer-events:all;cursor:pointer;
  display:none;border:1.5px solid rgba(255,255,255,0.2);
}
#reticle{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:80px;height:80px;opacity:0.7;display:none;
}
#topbar{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:env(safe-area-inset-top,16px) 20px 12px;
  background:linear-gradient(to bottom,rgba(0,0,0,0.6),transparent);
  pointer-events:all;
}
#wordmark{color:#fff;font-family:-apple-system,sans-serif;font-size:18px;font-weight:800;letter-spacing:0.5px}
#modelpicker{
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);
  color:#fff;font-family:-apple-system,sans-serif;font-size:12px;
  padding:6px 10px;border-radius:10px;pointer-events:all;cursor:pointer;
}
#loading{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:#0a0a0a;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:10;
}
.spin{
  width:40px;height:40px;border:3px solid rgba(124,58,237,0.3);
  border-top-color:#7C3AED;border-radius:50%;
  animation:s 0.8s linear infinite;margin-bottom:16px;
}
@keyframes s{to{transform:rotate(360deg)}}
#loading p{color:#aaa;font-family:-apple-system,sans-serif;font-size:14px;margin-bottom:6px}
#loading small{color:#555;font-family:-apple-system,sans-serif;font-size:12px}
#error-screen{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:#0a0a0a;display:none;flex-direction:column;
  align-items:center;justify-content:center;z-index:10;padding:32px;text-align:center;
}
#error-screen p{color:#f87171;font-family:-apple-system,sans-serif;font-size:15px;line-height:1.6}
#error-screen small{color:#555;font-family:-apple-system,sans-serif;font-size:12px;margin-top:12px;display:block}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="cvs"></canvas>

<div id="ui">
  <div id="topbar">
    <span id="wordmark">ARIGroup</span>
    <select id="modelpicker" onchange="switchModel(this.value)">
      <option value="demo">Demo (Astronaut)</option>
    </select>
  </div>
  <svg id="reticle" viewBox="0 0 80 80" fill="none">
    <circle cx="40" cy="40" r="36" stroke="white" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="40" cy="40" r="4" fill="white"/>
  </svg>
  <div id="status">Starting camera…</div>
  <div id="placebtn" onclick="place()">Tap to place</div>
</div>

<div id="loading">
  <div class="spin"></div>
  <p id="lt">Loading…</p>
  <small>Open in Chrome on Android for best results</small>
</div>
<div id="error-screen">
  <p id="err-txt"></p>
  <small>Try opening in Chrome on Android</small>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const API = 'https://arigroup-api.onrender.com';

// Pick model from URL ?id=xxx or default to demo
const params = new URLSearchParams(location.search);
const modelId = params.get('id');
const MODEL_URL = modelId
  ? `${API}/model/${modelId}`
  : 'https://arigroup-web.vercel.app/demo-model.glb';

let scene, cam3, rndr, model, placed = false;

const $st  = document.getElementById('status');
const $pb  = document.getElementById('placebtn');
const $rc  = document.getElementById('reticle');
const $ld  = document.getElementById('loading');
const $lt  = document.getElementById('lt');
const $err = document.getElementById('error-screen');
const $etx = document.getElementById('err-txt');

function showError(msg) {
  $ld.style.display = 'none';
  $err.style.display = 'flex';
  $etx.textContent = msg;
}

function st(msg) { $st.textContent = msg; }

// ── Three.js ──────────────────────────────────────────────────────────────
function initThree() {
  scene = new THREE.Scene();
  cam3  = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 100);
  cam3.position.set(0, 0.5, 2);

  const cvs = document.getElementById('cvs');
  rndr = new THREE.WebGLRenderer({ canvas: cvs, alpha: true, antialias: true });
  rndr.setPixelRatio(devicePixelRatio);
  rndr.setSize(innerWidth, innerHeight);
  rndr.setClearColor(0, 0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
  const d = new THREE.DirectionalLight(0xffffff, 0.8);
  d.position.set(1, 2, 2); scene.add(d);

  window.addEventListener('resize', () => {
    cam3.aspect = innerWidth / innerHeight;
    cam3.updateProjectionMatrix();
    rndr.setSize(innerWidth, innerHeight);
  });
}

// ── GLTF loader ───────────────────────────────────────────────────────────
function loadGLTFScript() {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

function loadGLB(url) {
  $lt.textContent = 'Loading 3D model…';
  return new Promise((res, rej) => {
    new THREE.GLTFLoader().load(url, g => res(g.scene), undefined, rej);
  });
}

function normalise(g) {
  const box = new THREE.Box3().setFromObject(g);
  const sz  = box.getSize(new THREE.Vector3());
  const mx  = Math.max(sz.x, sz.y, sz.z);
  if (mx > 0) g.scale.setScalar(0.6 / mx);
  const c = box.getCenter(new THREE.Vector3());
  g.position.sub(c.multiplyScalar(0.6 / mx));
}

// ── Camera ────────────────────────────────────────────────────────────────
async function startCamera() {
  const v = document.getElementById('cam');
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
    audio: false
  });
  v.srcObject = stream;
  await new Promise(r => { v.onloadedmetadata = r; });
  v.play();
}

// ── Controls ──────────────────────────────────────────────────────────────
function place() {
  if (!model || placed) return;
  placed = true;
  model.visible = true;
  model.position.set(0, -0.3, -1.2);
  $pb.style.display = 'none';
  $rc.style.display = 'none';
  st('Drag to rotate · Pinch to scale');
  setTimeout(() => { $st.style.opacity = '0'; }, 3000);
}
window.place = place;

let ltouch = null, lpinch = null;
document.addEventListener('touchstart', e => {
  if (!placed || !model) return;
  if (e.touches.length === 1) ltouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  else if (e.touches.length === 2) {
    lpinch = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!placed || !model) return;
  if (e.touches.length === 1 && ltouch) {
    const dx = e.touches[0].clientX - ltouch.x;
    const dy = e.touches[0].clientY - ltouch.y;
    model.rotation.y += dx * 0.01;
    model.rotation.x = Math.max(-Math.PI/3, Math.min(Math.PI/3, model.rotation.x + dy * 0.005));
    ltouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  } else if (e.touches.length === 2 && lpinch != null) {
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const s = Math.max(0.05, Math.min(5, model.scale.x * (d / lpinch)));
    model.scale.setScalar(s);
    lpinch = d;
  }
}, { passive: true });

document.addEventListener('touchend', () => { ltouch = null; lpinch = null; }, { passive: true });

// Also support mouse drag on desktop
let mouse = null;
document.addEventListener('mousedown', e => { if (placed && model) mouse = { x: e.clientX, y: e.clientY }; });
document.addEventListener('mousemove', e => {
  if (!mouse || !placed || !model) return;
  model.rotation.y += (e.clientX - mouse.x) * 0.01;
  model.rotation.x = Math.max(-Math.PI/3, Math.min(Math.PI/3, model.rotation.x + (e.clientY - mouse.y) * 0.005));
  mouse = { x: e.clientX, y: e.clientY };
});
document.addEventListener('mouseup', () => { mouse = null; });
document.addEventListener('click', () => { if (!placed) place(); });

// ── Render loop ───────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  if (!placed && model) model.rotation.y += 0.008;
  rndr.render(scene, cam3);
}

// ── Load new model ────────────────────────────────────────────────────────
async function switchModel(id) {
  if (!scene) return;
  if (model) { scene.remove(model); model = null; }
  placed = false;
  $pb.style.display = 'none';
  $rc.style.display = 'none';
  st('Loading…');
  try {
    const url = id === 'demo'
      ? 'https://arigroup-web.vercel.app/demo-model.glb'
      : `${API}/model/${id}`;
    const g = await loadGLB(url);
    normalise(g);
    g.visible = false;
    scene.add(g); model = g;
    st('Point at a surface');
    $rc.style.display = 'block';
    $pb.style.display = 'block';
    $st.style.opacity = '1';
  } catch (e) {
    st('Failed to load model');
  }
}
window.switchModel = switchModel;

// ── Populate picker with live models ─────────────────────────────────────
async function fetchModels() {
  try {
    const res = await fetch(`${API}/models`);
    if (!res.ok) return;
    const data = await res.json();
    const sel = document.getElementById('modelpicker');
    (data.models || data).forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id; opt.textContent = m.name;
      if (m.id === modelId) opt.selected = true;
      sel.appendChild(opt);
    });
  } catch {}
}

// ── Main ──────────────────────────────────────────────────────────────────
async function main() {
  initThree();
  fetchModels();

  try {
    const [g] = await Promise.all([
      loadGLTFScript().then(() => loadGLB(MODEL_URL)),
      startCamera().catch(() => {
        st('Camera unavailable — 3D preview only');
      })
    ]);

    normalise(g);
    g.visible = false;
    scene.add(g); model = g;

    $ld.style.display = 'none';
    st('Point at a surface');
    $rc.style.display = 'block';
    $pb.style.display = 'block';
    animate();

  } catch (e) {
    console.error(e);
    showError('Failed to load 3D model: ' + (e && e.message || 'unknown error'));
  }
}

main();
</script>
</body>
</html>
