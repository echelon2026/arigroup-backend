<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR – WebXR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .header { text-align: center; padding: 20px 16px 0; }
    .badge {
      display: inline-block; background: #0d9f6e; color: #fff;
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; padding: 4px 10px; border-radius: 4px; margin-bottom: 10px;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    p.sub { font-size: 13px; color: #aaa; }
    model-viewer {
      width: 100%; height: calc(100vh - 130px);
      --progress-bar-color: #0d9f6e;
    }
    #status {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.7); color: #fff; padding: 10px 18px;
      border-radius: 8px; font-size: 13px; pointer-events: none;
      white-space: nowrap;
    }
    .label { font-size: 11px; color: #555; text-align: center; padding: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">Method 4 — WebXR</div>
    <h1>WebXR (browser-native AR)</h1>
    <p class="sub">Auto-launches AR via browser WebXR API</p>
  </div>

  <model-viewer
    id="mv"
    src="https://arigroup-web.vercel.app/models/astronaut.glb"
    alt="Astronaut 3D model"
    ar
    ar-modes="webxr"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1"
    loading="eager">
  </model-viewer>

  <div id="status">Loading model…</div>
  <p class="label">Android Chrome only · WebXR immersive-ar session</p>

  <script>
    const mv = document.getElementById('mv');
    const status = document.getElementById('status');

    mv.addEventListener('load', () => {
      if (mv.canActivateAR) {
        status.textContent = 'Opening WebXR AR…';
        setTimeout(() => {
          try { mv.activateAR(); }
          catch(e) { status.textContent = 'Tap the AR button to start'; }
        }, 600);
      } else {
        status.textContent = 'WebXR AR not supported on this device/browser';
      }
    });

    mv.addEventListener('error', () => {
      status.textContent = 'Failed to load model';
    });

    mv.addEventListener('ar-status', (e) => {
      const s = e.detail?.status;
      if (s === 'session-started') status.textContent = 'AR active — point at a flat surface';
      else if (s === 'not-presenting') status.textContent = 'AR ended';
      else if (s === 'failed') status.textContent = 'WebXR AR failed — not supported on this browser';
    });
  </script>
</body>
</html>
