<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Step 2 — Model Load</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; }

  /* Camera behind everything */
  #cam {
    position:fixed; top:0; left:0; width:100%; height:100%;
    object-fit:cover; z-index:0;
  }

  /* Three.js canvas on top, transparent background */
  #cvs {
    position:fixed; top:0; left:0; width:100%; height:100%;
    z-index:1; pointer-events:none;
  }

  /* Status bar */
  #status {
    position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.7); color:#fff;
    font-family:-apple-system,sans-serif; font-size:14px; font-weight:600;
    padding:10px 24px; border-radius:20px; white-space:nowrap; z-index:5;
  }

  /* Log box — shows raw errors so we can debug */
  #log {
    position:fixed; top:12px; left:12px; right:12px;
    background:rgba(0,0,0,0.75); color:#0f0;
    font-family:monospace; font-size:11px;
    padding:10px; border-radius:8px; z-index:10;
    max-height:120px; overflow-y:auto;
    pointer-events:none;
  }
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<canvas id="cvs"></canvas>
<div id="status">Starting camera…</div>
<div id="log"></div>

<!-- Three.js r137 (same version as camera-float.html) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
  var LOG   = document.getElementById('log');
  var ST    = document.getElementById('status');

  function log(msg, col) {
    var line = document.createElement('div');
    line.style.color = col || '#0f0';
    line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    LOG.appendChild(line);
    LOG.scrollTop = LOG.scrollHeight;
    console.log(msg);
  }

  function status(msg) { ST.textContent = msg; }

  // ── 1. Camera ───────────────────────────────────────────────────────────────
  var video = document.getElementById('cam');

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  })
  .then(function(stream) {
    video.srcObject = stream;
    video.play();
    log('Camera OK');
    status('Camera OK — loading model…');
  })
  .catch(function(e) {
    log('Camera FAIL: ' + e.message, '#f00');
    status('Camera failed — ' + e.message);
  });

  // ── 2. Three.js scene ───────────────────────────────────────────────────────
  var canvas   = document.getElementById('cvs');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0); // transparent — camera shows through

  var scene  = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);
  camera.position.set(0, 0, 3);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));
  var sun = new THREE.DirectionalLight(0xffffff, 1.5);
  sun.position.set(2, 4, 3);
  scene.add(sun);

  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ── 3. Load model ────────────────────────────────────────────────────────────
  var params   = new URLSearchParams(location.search);
  var modelUrl = params.get('model') || 'https://arigroup-web.vercel.app/models/astronaut.glb';

  log('Loading: ' + modelUrl.split('/').pop());
  status('Loading model…');

  var loader = new THREE.GLTFLoader();
  loader.load(
    modelUrl,

    // ── success ────────────────────────────────────────────────────────────────
    function(gltf) {
      log('Model loaded OK');
      status('Model loaded — spinning');

      var model = gltf.scene;

      // Normalise to ~1 unit tall, centred at origin
      var box  = new THREE.Box3().setFromObject(model);
      var size = box.getSize(new THREE.Vector3());
      var maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) model.scale.setScalar(1 / maxDim);

      var centre = box.getCenter(new THREE.Vector3());
      model.position.sub(centre.multiplyScalar(1 / maxDim));

      scene.add(model);

      // Spin in render loop so we can confirm it's actually rendering
      function animate() {
        requestAnimationFrame(animate);
        model.rotation.y += 0.012;
        renderer.render(scene, camera);
      }
      animate();
    },

    // ── progress ───────────────────────────────────────────────────────────────
    function(xhr) {
      if (xhr.total > 0) {
        var pct = Math.round((xhr.loaded / xhr.total) * 100);
        status('Loading model… ' + pct + '%');
        log('Progress: ' + pct + '%');
      }
    },

    // ── error ──────────────────────────────────────────────────────────────────
    function(err) {
      log('Model FAIL: ' + (err.message || String(err)), '#f00');
      status('Model failed to load');
    }
  );
</script>
</body>
</html>
