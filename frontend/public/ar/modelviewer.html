<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR – model-viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .header {
      text-align: center; padding: 20px 16px 0;
    }
    .badge {
      display: inline-block; background: #e37400; color: #fff;
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; padding: 4px 10px; border-radius: 4px; margin-bottom: 10px;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    p { font-size: 13px; color: #aaa; }
    model-viewer {
      width: 100%; height: calc(100vh - 120px);
      --progress-bar-color: #e37400;
    }
    .label { font-size: 11px; color: #555; text-align: center; padding: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">Method 3 — model-viewer</div>
    <h1>Google model-viewer</h1>
    <p>Tap the AR button (bottom-right) to place in your space</p>
  </div>

  <model-viewer
    src="https://arigroup-web.vercel.app/models/astronaut.glb"
    ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
    alt="Astronaut 3D model"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1"
    loading="eager">
    <button slot="ar-button" style="
      position: absolute; bottom: 16px; right: 16px;
      background: #e37400; color: #fff; border: none;
      padding: 12px 20px; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    ">View in AR</button>
  </model-viewer>

  <p class="label">Android + iOS · Manual AR button tap</p>
</body>
</html>
