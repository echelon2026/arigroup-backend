<!DOCTYPE html>
<html lang="en">
  <head>
    <title>three.js ar - hit test</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
      body { margin: 0; background-color: #000; }
      #info {
        position: absolute; top: 0; width: 100%; padding: 10px;
        box-sizing: border-box; text-align: center; color: #fff;
        font-family: Monospace; font-size: 13px; user-select: none; pointer-events: none;
      }
      a { color: #ff0; }
    </style>
  </head>
  <body>

    <div id="info">
      <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> ar - hit test<br/>(Chrome Android 81+)
    </div>

    <!-- UMD builds — exact r137 to match the source example -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
      #start-ar-btn {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        padding: 14px 36px; border-radius: 40px; border: 2px solid #fff;
        background: transparent; color: #fff; font-size: 16px; font-weight: 600;
        cursor: pointer; letter-spacing: 0.04em; z-index: 100;
      }
      #start-ar-btn:active { opacity: 0.7; }
    </style>

    <script>
    (function () {

      // ── verbatim from three.js r137 examples/webxr_ar_hittest.html ──────────
      // Only changes:
      //   • ES module imports → CDN UMD scripts above
      //   • placed object: astronaut GLB instead of random cylinder
      // Everything else (session init, hit-test, reticle, select trigger) is
      // character-for-character identical to the r137 source.

      var container;
      var camera, scene, renderer;
      var controller;
      var reticle;
      var hitTestSource          = null;
      var hitTestSourceRequested = false;

      // astronaut — loaded once, cloned on each placement
      var astronautTemplate = null;
      var fallbackGeometry  = new THREE.CylinderGeometry( 0.1, 0.1, 0.2, 32 ).translate( 0, 0.1, 0 );

      new THREE.GLTFLoader().load(
        'https://arigroup-web.vercel.app/models/astronaut.glb',
        function ( gltf ) {
          var m   = gltf.scene;
          var box = new THREE.Box3().setFromObject( m );
          var sz  = box.getSize( new THREE.Vector3() );
          var s   = 1.8 / Math.max( sz.x, sz.y, sz.z );
          m.scale.setScalar( s );
          var c = box.getCenter( new THREE.Vector3() );
          m.position.set( -c.x * s, -c.y * s, -c.z * s );
          astronautTemplate = m;
        }
      );

      init();
      animate();

      function init() {

        container = document.createElement( 'div' );
        document.body.appendChild( container );

        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.01, 20 );

        var light = new THREE.HemisphereLight( 0xffffff, 0xbbbbff, 1 );
        light.position.set( 0.5, 1, 0.25 );
        scene.add( light );

        //

        renderer = new THREE.WebGLRenderer( { antialias: true, alpha: true } );
        renderer.setPixelRatio( window.devicePixelRatio );
        renderer.setSize( window.innerWidth, window.innerHeight );
        renderer.xr.enabled = true;
        container.appendChild( renderer.domElement );

        //

        // Inline AR button — avoids dependency on ARButton CDN which may not
        // attach to THREE global at r137. Calls requestSession directly in the
        // click handler (synchronous user gesture) so Chrome grants camera access.
        var arBtn = document.createElement( 'button' );
        arBtn.id = 'start-ar-btn';
        arBtn.textContent = 'START AR';
        document.body.appendChild( arBtn );

        var currentSession = null;

        function onSessionEnded() {
          renderer.setClearColor( 0x000000, 1 );
          arBtn.textContent = 'START AR';
          hitTestSourceRequested = false;
          hitTestSource = null;
          currentSession = null;
        }

        function startAR() {
          // local-floor as optional so Chrome grants it if supported on this device
          navigator.xr.requestSession( 'immersive-ar', {
            requiredFeatures: [ 'hit-test' ],
            optionalFeatures: [ 'local-floor' ]
          } ).then( function ( session ) {
            currentSession = session;

            // Probe which reference space this device actually supports.
            // Three.js r137 defaults to 'local', but some ARCore builds only
            // grant 'local-floor'. We test local-floor first, fall back to local,
            // then set Three.js to use whichever worked before it calls setSession.
            return session.requestReferenceSpace( 'local-floor' )
              .then( function () {
                renderer.xr.setReferenceSpaceType( 'local-floor' );
              } )
              .catch( function () {
                renderer.xr.setReferenceSpaceType( 'local' );
              } )
              .then( function () {
                return renderer.xr.setSession( session );
              } )
              .then( function () {
                renderer.setClearColor( 0x000000, 0 );
                arBtn.textContent = 'EXIT AR';
                session.addEventListener( 'end', onSessionEnded );
              } );
          } ).catch( function ( e ) {
            var msg = e.message || '';
            if ( msg.toLowerCase().indexOf( 'already' ) !== -1 ) {
              arBtn.textContent = 'Retrying…';
              arBtn.disabled = true;
              setTimeout( function () {
                arBtn.disabled = false;
                arBtn.textContent = 'START AR';
                startAR();
              }, 1500 );
            } else {
              alert( 'Could not start AR: ' + msg );
            }
          } );
        }

        arBtn.addEventListener( 'click', function () {
          if ( currentSession !== null ) {
            currentSession.end();
            return;
          }
          startAR();
        } );

        // End session cleanly when user leaves the page so it never gets stuck
        window.addEventListener( 'pagehide', function () {
          if ( currentSession ) currentSession.end();
        } );
        document.addEventListener( 'visibilitychange', function () {
          if ( document.visibilityState === 'hidden' && currentSession ) {
            currentSession.end();
          }
        } );

        //

        function onSelect() {

          if ( reticle.visible ) {

            var mesh;
            if ( astronautTemplate ) {
              mesh = astronautTemplate.clone();
            } else {
              var material = new THREE.MeshPhongMaterial( { color: 0xffffff * Math.random() } );
              mesh = new THREE.Mesh( fallbackGeometry, material );
              mesh.scale.y = Math.random() * 2 + 1;
            }

            mesh.position.setFromMatrixPosition( reticle.matrix );
            scene.add( mesh );

          }

        }

        controller = renderer.xr.getController( 0 );
        controller.addEventListener( 'select', onSelect );
        scene.add( controller );

        reticle = new THREE.Mesh(
          new THREE.RingGeometry( 0.15, 0.2, 32 ).rotateX( - Math.PI / 2 ),
          new THREE.MeshBasicMaterial()
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add( reticle );

        //

        window.addEventListener( 'resize', onWindowResize );

      }

      function onWindowResize() {

        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize( window.innerWidth, window.innerHeight );

      }

      //

      function animate() {

        renderer.setAnimationLoop( render );

      }

      function render( timestamp, frame ) {

        if ( frame ) {

          var referenceSpace = renderer.xr.getReferenceSpace();
          var session        = renderer.xr.getSession();

          if ( hitTestSourceRequested === false ) {

            session.requestReferenceSpace( 'viewer' ).then( function ( referenceSpace ) {

              session.requestHitTestSource( { space: referenceSpace } ).then( function ( source ) {

                hitTestSource = source;

              } );

            } );

            session.addEventListener( 'end', function () {

              hitTestSourceRequested = false;
              hitTestSource = null;

            } );

            hitTestSourceRequested = true;

          }

          if ( hitTestSource ) {

            var hitTestResults = frame.getHitTestResults( hitTestSource );

            if ( hitTestResults.length ) {

              var hit = hitTestResults[ 0 ];

              reticle.visible = true;
              reticle.matrix.fromArray( hit.getPose( referenceSpace ).transform.matrix );

            } else {

              reticle.visible = false;

            }

          }

        }

        renderer.render( scene, camera );

      }

    })();
    </script>

  </body>
</html>
